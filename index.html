<head>

  <link rel="stylesheet" href="paketsewa.css">
  <link rel="icon" type="image/png" href="WhatsApp Image 2026-02-26 at 14.49.18.JPG">
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-light navbar-light" id="mainNavbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="https://akbarbtg445.github.io/Heyaweb/">Heyacamp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="https://akbarbtg445.github.io/Heyaweb/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://akbarbtg445.github.io/Carasewa/">Cara Sewa</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE4MjAyNTU4ODQwMzI3ODkw?story_media_id=3840905873464633452_80128154365&igsh=MWkybmd2ZGl4bzJweg==">Pengumuman</a></li>
          <li class="nav-item"><a class="nav-link" href="https://akbarbtg445.github.io/Alat-yang-disewakan/">Alat yang disewakan</a></li>
          <li class="nav-item"><a class="nav-link" href="https://akbarbtg445.github.io/Paketsewa/">Paket sewa</a></li>
          <li class="nav-item"><a class="nav-link" href="https://akbarbtg445.github.io/Hubungi-kami/">Hubungi kami</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="text-center mt-3">
      <h1>Heya Camp</h1>
      <h2>Tempat Perentalan Alat Outdoor</h2>
    </div>
    <div class="clearfix mt-3">
      <img id="Camp" src="Paket beginer.jpg" alt="Paket Beginner" class="img-fluid float-start" style="width: 520px; height: 700px;">
      <img id="Camp" src="paket elder.jpg" alt="Paket Elder" class="img-fluid float-end" style="width: 520px; height: 700px;">
    </div>
    <div class="text-center mt-3">
      <h3>Kamu mau sewa satuan? Boleh juga. Chat ke Admin kami saja untuk mendapatkan price list-nya.</h3>
    </div>
  </div>

  <div class="taskbar bg-dark text-white p-3 mt-5">
    <div class="taskbar-item mb-2">
      <label class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="themeToggle" />
        <span id="themeLabel">🌞 Mode Terang</span>
      </label>
    </div>
    <div class="copyright text-center">&copy; 2024 Perentalan Alat Outdoor Heyacamp</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    const navbar = document.getElementById('mainNavbar');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.remove('light-mode');
        document.body.classList.add('dark-mode');
        navbar.classList.remove('bg-light', 'navbar-light');
        navbar.classList.add('bg-dark', 'navbar-dark');
        label.textContent = '🌙 Mode Gelap';
      } else {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        navbar.classList.remove('bg-dark', 'navbar-dark');
        navbar.classList.add('bg-light', 'navbar-light');
        label.textContent = '🌞 Mode Terang';
      }
      localStorage.setItem('theme', theme);
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    toggle.checked = savedTheme === 'dark';
    applyTheme(savedTheme);

    toggle.addEventListener('change', () => {
      applyTheme(toggle.checked ? 'dark' : 'light');
    });
  </script>
</body>
</html>
